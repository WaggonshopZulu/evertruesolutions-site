<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evertrue Solutions</title>
  <style>
    :root {
      --bg: #0f1115;
    --card: #171a21;
    --text: #eef0f3;
          --muted: #9aa3af;
    --accent: #4f8cff;
}
  * { box-sizing: border-box; }
  html, body {
        height: 100%;
    margin: 0;
}
  body {
        display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
}
  .card {
        background: var(--card);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
  h1 {
        font-size: 1.8rem;
    letter-spacing: 0.02em;
    margin: 0 0 8px;
}
  p.tagline {
    color: var(--muted);
    font-size: 1rem;
    margin: 0 0 32px;
    line-height: 1.5;
  }
  a.contact {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
    border: 1px solid rgba(79,140,255,0.4);
    border-radius: 8px;
    padding: 10px 20px;
    transition: background 0.2s ease;
  }
  a.contact:hover {
        background: rgba(79,140,255,0.1);
  }
  .footer {
        margin-top: 28px;
    font-size: 0.75rem;
    color: #4a5057;
}
</style>
  </head>
  <body>
    <div class="card">
      <h1>Evertrue Solutions</h1>
      <p class="tagline">A new venture, in motion.<br>More to come.</p>
    <a class="contact" href="mailto:andrew@evertruesolutions.ca">andrew@evertruesolutions.ca</a>
      <div class="footer">&copy; 2026 Evertrue Solutions</div>
    </div>
  </body>
  </html>
